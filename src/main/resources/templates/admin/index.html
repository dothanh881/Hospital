<script>
    function deletePatient(patientId) {
        if (confirm("Bạn có muốn xóa bệnh nhân??")) {
            $.ajax({
                url: `/patient/delete/${patientId}`,
                type: 'DELETE',
                success: function(data) {
                    if (data.message === "Xóa thành công") {
                        alert(data.message);
                        // Optionally, reload the page or remove the patient row from the UI
                        location.reload();
                    } else {
                        alert(data.message);
                    }
                },
                error: function(xhr, status, error) {
                    console.error("Error:", error);
                    alert("Lỗi.");
                }
            });
        }
    }

    function loadDistricts(cityId) {
        // Clear existing options
        const districtSelect = document.getElementById('districtId');
        districtSelect.innerHTML = '<option value="" disabled selected>Chọn quận/huyện</option>';

        // Fetch districts
        fetch(`/districts/${cityId}`)
            .then(response => response.json())
            .then(districts => {
                districts.forEach(district => {
                    const option = document.createElement('option');
                    option.value = district.districtId; // Adjust this if your field name is different
                    option.textContent = district.districtName; // Adjust to your attribute
                    districtSelect.appendChild(option);
                });
            })
            .catch(error => {
                console.error('Error fetching districts:', error);
            });
    }

    function loadWards(districtId) {
        // Clear existing options
        const wardSelect = document.getElementById('wardId');
        wardSelect.innerHTML = '<option value="" disabled selected>Chọn phường/xã</option>';

        // Fetch wards
        fetch(`/wards/${districtId}`)
            .then(response => response.json())
            .then(wards => {
                wards.forEach(ward => {
                    const option = document.createElement('option');
                    option.value = ward.wardId; // Adjust this if your field name is different
                    option.textContent = ward.wardName; // Adjust to your attribute
                    wardSelect.appendChild(option);
                });
            })
            .catch(error => {
                console.error('Error fetching wards:', error);
            });
    }
</script>
<script>
    // Function to fetch examination stats
    function fetchExaminationStats(year) {
        fetch(`/examination/stats?year=${year}`)
            .then(response => response.json())
            .then(data => {
                renderExaminationChart(data);
            })
            .catch(error => {
                console.error('Error fetching examination stats:', error);
            });
    }

    // Function to render chart using Chart.js
    function renderExaminationChart(data) {
        const months = [];
        const counts = [];

        for (let month = 1; month <= 12; month++) {
            months.push(getMonthName(month));
            counts.push(data[month] || 0); // Default to 0 if no data for the month
        }

        const ctx = document.getElementById('examinationChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: months,
                datasets: [{
                    label: 'Examinations',
                    data: counts,
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',  // Light teal color
                    borderColor: 'rgba(75, 192, 192, 1)', // Darker teal for borders
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true, // Make the chart responsive to screen size
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1
                        }
                    }
                }
            }
        });
    }

    // Helper function to get month names from numbers
    function getMonthName(monthNumber) {
        const months = ['T1', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'T8', 'T9', 'T10', 'T11', 'T12'];
        return months[monthNumber - 1];
    }

    // Get current year and fetch stats for examination
    const currentYear = new Date().getFullYear();
    document.getElementById('yearExamination').innerText = currentYear;
    fetchExaminationStats(currentYear);

    // ----------------------------------admission
    // Fetch the data from the backend
    function fetchAdmissionStats(year) {
        fetch(`/admission/stats?year=${year}`)
            .then(response => response.json())
            .then(data => {
                renderAdmissionChart(data);
            })
            .catch(error => {
                console.error('Error fetching admission stats:', error);
            });
    }

    // Render the Chart.js chart
    function renderAdmissionChart(data) {
        const months = [];
        const counts = [];

        for (let month = 1; month <= 12; month++) {
            months.push(getMonthName(month));
            counts.push(data[month] || 0); // Default to 0 if no data for the month
        }

        const ctx = document.getElementById('admissionsChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: months,
                datasets: [{
                    label: 'Admissions',
                    data: counts,
                    backgroundColor: 'rgba(75, 192, 192, 0.2)',  // Light teal color
                    borderColor: 'rgba(75, 192, 192, 1)', // Darker teal for borders
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true, // Make the chart responsive to screen size
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1
                        }
                    }
                }
            }
        });
    }

    // Fetch the stats for the current year
    document.getElementById('year').innerText = currentYear;
    fetchAdmissionStats(currentYear);
</script>
