            'applyClass' : 'btn-sm btn-success',

            locale: {
                applyLabel: 'Apply',
                cancelLabel: 'Cancel',
            }
        })
            .prev().on(ace.click_event, function(){
            $(this).next().focus();
        });
        $(document).one('ajaxloadstart.page', function(e) {
            $('textarea[class*=autosize]').trigger('autosize.destroy');
            $('.limiterBox,.autosizejs').remove();
            $('.daterangepicker.dropdown-menu,.colorpicker.dropdown-menu,.bootstrap-datetimepicker-widget.dropdown-menu').remove();
        });

    });
</script>
<script>

    function calculateFeeExamination() {
        const medicationBodies = document.querySelectorAll('.medicationTable tbody');
        let total = 0;
        medicationBodies.forEach(medicationBody => {
            const rows = medicationBody.querySelectorAll('tr');
            rows.forEach(row => {
                const price = parseFloat(row.querySelector('input[name="price"]').value) || 0;
                const quantity = parseInt(row.querySelector('input[name="quantity"]').value) || 0;
                total += price * quantity;
            });
        });
        document.getElementById('total').value = total.toFixed(2);
    }

    // Attach event listeners to automatically calculate when price or quantity changes
    document.querySelectorAll("#medicationBody input[name='price'], #medicationBody input[name='quantity']").forEach(input => {
        input.addEventListener("input", calculateFeeExamination);
    });
    function deleteAdmission(admissionId) {
        if (confirm("Bạn có muốn xóa??")) {
            $.ajax({
                url: `/admission/delete/${admissionId}`,
                type: 'DELETE',
                success: function(data) {
                    if (data.message === "Xóa thành công") {
                        alert(data.message);
                        // Optionally, reload the page or remove the patient row from the UI
                        location.reload();
                    } else {
                        alert(data.message);
                    }
                },
                error: function(xhr, status, error) {
                    console.error("Error:", error);
                    alert("Lỗi.");
                }
            });
        }
    }
    function deleteTreatment(treatmentId) {
        if (confirm("Bạn có muốn xóa??")) {
            $.ajax({
                url: `/treatment/delete/${treatmentId}`,
                type: 'DELETE',
                success: function(data) {
                    if (data.message === "Xóa thành công") {
                        alert(data.message);
                        // Optionally, reload the page or remove the patient row from the UI
                        location.reload();
                    } else {
                        alert(data.message);
                    }
                },
                error: function(xhr, status, error) {
                    console.error("Error:", error);
                    alert("Lỗi.");
                }
            });
        }
    }
    function editAdmission(admissionId, modalId) {
        let formData = {
            admissionId: admissionId,
            doctorId: $(`#admissionDoctorId-${admissionId}`).val(),
            nurseId: $(`#nurseId-${admissionId}`).val(),
            dateAdmission: $(`#dateAdmission-${admissionId}`).val(),
            dateOfDischarge: $(`#dateOfDischarge-${admissionId}`).val(),
            diagnosis: $(`#admissionDiagnosis-${admissionId}`).val(),
            fee: $(`#admissionFee-${admissionId}`).val(),
            sickroom: $(`#sickroom-${admissionId}`).val(),
        };

        $.ajax({
            url: `/admission/edit?id=${admissionId}`,  // API endpoint
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(formData),
            success: function(response) {
                console.log("Success:", response);
                $('#postResultDiv').removeClass('alert-danger').addClass('alert-success');
                $('#alertMessage').text("Cập nhật thành công");
                $(`#${modalId}`).modal('hide');
                $('#postResultDiv').show().addClass('alert-fixed');
                const activeTab = $('.tab-pane.active').attr('id');
                $(`#${activeTab}`).load(location.href + ` #${activeTab} > *`, function() {
                    console.log(`Active tab ${activeTab} reloaded successfully`);
                });

                setTimeout(function() {
                    $('#postResultDiv').fadeOut();
                }, 5000);
            },
            error: function(error) {
                $('#postResultDiv').removeClass('alert-success').addClass('alert-danger');
                $('#alertMessage').text("Không thành công");
                $('#postResultDiv').show().addClass('alert-fixed');
                setTimeout(function() {
                    $('#postResultDiv').fadeOut();
                }, 5000);
            }
        });
    }
    function openAddTreatmentModal(button) {
        var admissionId = $(button).data('admission-id');
        console.log('Admission ID: ' + admissionId);

        // Set the admissionId in the hidden input field
        $('#addTreatment').find('#admissionId').val(admissionId);

        // Open the modal
        $('#addTreatment').modal('show');

    }
    // Function to collect form data and send it using AJAX
    function submitTreatmentForm() {
        // Collect form data
        var formData = {

    // Function to calculate total price of medications + examination fee
    function calculateTotal() {
        var total = 0;

        // Iterate through each row in the medication table
        $('#medicationBody tr').each(function() {
            var price = $(this).find('input[name="price"]').val();
            var quantity = $(this).find('input[name="quantity"]').val();

            // Calculate the subtotal for each medication
            if (price && quantity) {
                total += price * quantity;
            }
        });

        // Add examination fee to total
        var examinationFee = parseFloat($('#examinationFee').val()) || 0;
        total += examinationFee;

        // Set the total fee field
        $('#totalFee').val(total.toFixed(2));
    }

        var formData = {

            examinationDate: $('#examinationDate').val(),
            diagnosis: $('#diagnosis').val(),
            medications: []
        };

        // Gather table data
        $('#medicationTable tbody tr').each(function() {
            var medication = {
                medicationName: $(this).find('input[name="medicationName"]').val(),
                dosage: $(this).find('input[name="dosage"]').val(),
                frequency: $(this).find('input[name="frequency"]').val()
            };
            formData.medications.push(medication);
        });

        // Send data to the backend via AJAX
        $.ajax({
            url: '/api/examinations',  // The URL of the API to handle form submission
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(formData),

            }
        });
    });
